services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: chainlit_crimea-rag:${DOCKER__APP_VERSION}
    pull_policy: missing
    container_name: chat-crimea_is_ukraine-org
    restart: always
    env_file:
      - .env
    volumes:
      - ./database:/app/database
      - ./public:/app/public
      - ./locales:/app/locales
      - ./.chainlit/config.toml:/app/.chainlit/config.toml
    ports:
      - "8001:8000"

  cloudflared:
#    image: cloudflare/cloudflared:latest
    image: cloudflare/cloudflared:2026.7.3
    container_name: chat-crimea_is_ukraine-org-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE__TUNNEL_TOKEN}
    depends_on:
      - web
